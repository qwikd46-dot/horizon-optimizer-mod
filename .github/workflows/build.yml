name: Build Horizon Optimizer

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout mod source
        uses: actions/checkout@v4
        with:
          path: mod-source

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build modded Horizon
        run: |
          # Work entirely inside the repo directory
          mkdir -p build
          cd build

          # Clone the source and mixins (both as siblings inside build/)
          git clone https://github.com/qwikd46-dot/horizon-offline horizon-source
          git clone https://github.com/horizon-rust/horizon-mixins.git horizon-mixins

          # Build horizon-mixins first
          cd horizon-mixins
          cargo build --locked -p horizon-mixins-cli
          cd ..

          # Apply the mod bundle to the source (output goes to a sibling, not inside workspace)
          cd horizon-source
          # Remove symlinks that horizon-mixins doesn't support
          find . -type l -delete
          ../horizon-mixins/target/debug/horizon-mixins apply \
            --workspace . \
            --mods /home/runner/work/horizon-optimizer-mod/horizon-optimizer-mod/mod-source/mixins/horizon_optimizer \
            --out /home/runner/work/horizon-optimizer-mod/horizon-modded

          # Build the modded game
          cd /home/runner/work/horizon-optimizer-mod/horizon-modded
          cargo build --release -p horizon-client --bin horizon-client

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: horizon-optimizer-binary
          path: /home/runner/work/horizon-optimizer-mod/horizon-modded/target/release/horizon-client
          if-no-files-found: error
